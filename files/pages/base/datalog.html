<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Keypress to Text Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Pulsing background effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(55, 65, 81, 0.8) 0%, rgba(17, 24, 39, 0.8) 50%, #111827 100%);
            animation: pulse-bg 15s infinite alternate;
            z-index: -2;
        }

        @keyframes pulse-bg {
            0% {
                background-size: 150% 150%;
            }
            100% {
                background-size: 120% 120%;
            }
        }

        /* Themed Scrollbar Styles for Webkit (Chrome, Safari) */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937; /* A dark color to match the theme */
        }

        ::-webkit-scrollbar-thumb {
            background-color: #4b5563; /* A slightly lighter gray for the thumb */
            border-radius: 4px;
            border: 2px solid #1f2937;
        }

        /* Themed Scrollbar Styles for Firefox */
        .frosted-glass, .scrollable-content {
            scrollbar-width: thin;
            scrollbar-color: #4b5563 #1f2937;
        }

        .frosted-glass {
            backdrop-filter: blur(10px);
            background-color: rgba(31, 41, 55, 0.7);
            border: 1px solid rgba(75, 85, 99, 0.5);
        }

        #copy-button, #download-button {
            transition: background-color 0.2s, transform 0.2s;
        }
        
        .container-content {
            z-index: 1;
            position: relative; /* Ensure content is on top */
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loader {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-6 relative">

    <div class="container-content w-full max-w-4xl flex flex-col items-center gap-6">
        <div class="frosted-glass rounded-xl shadow-lg p-8 w-full flex flex-col items-center gap-6">

            <!-- Page Header -->
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white text-center mb-4">JSON Keypress to Text Converter</h1>
            <p class="text-gray-200 text-center mb-6">Select a local JSON file containing keypress data to view the resulting text.</p>

            <!-- File Input -->
            <label for="json-file-input" class="cursor-pointer bg-blue-600 shadow-md hover:bg-blue-700 hover:shadow-xl text-white font-semibold py-2 px-4 rounded-lg transition-all duration-300 transform hover:scale-110">
                Choose JSON File
            </label>
            <input type="file" id="json-file-input" class="hidden" accept=".json">

            <!-- Output Container (Initially Hidden) -->
            <div id="output-container" class="hidden opacity-0 flex flex-col w-full gap-6 transition-all duration-700 ease-in-out transform -translate-y-2">

                <!-- The main text output area -->
                <div class="w-full h-96 flex flex-col bg-gray-900 border border-gray-700 rounded-lg overflow-hidden relative">
                    <!-- Loading Spinner -->
                    <div id="loader" class="absolute inset-0 flex items-center justify-center bg-gray-900 bg-opacity-70 z-10 hidden">
                        <svg class="loader h-12 w-12 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </div>
                    
                    <!-- Header with count and buttons -->
                    <div class="flex-shrink-0 flex justify-between items-center bg-gray-700 bg-opacity-70 p-2 rounded-t-lg">
                        <!-- Character Count Display -->
                        <p id="char-count-display" class="p-1 rounded-md text-sm font-mono text-gray-300">Count: 0</p>
                        <div class="flex flex-row gap-2">
                            <!-- Copy Button -->
                            <button id="copy-button" class="p-2 rounded-lg bg-gray-700 hover:bg-gray-600 transition-colors duration-200" title="Copy Text" disabled>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                </svg>
                            </button>
                            <!-- Download Button -->
                            <button id="download-button" class="p-2 rounded-lg bg-gray-700 hover:bg-gray-600 transition-colors duration-200" title="Download Plaintext" disabled>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Scrollable content area -->
                    <div class="scrollable-content flex-grow overflow-y-auto px-4 pb-4">
                        <!-- Plaintext Output -->
                        <pre id="text-output" class="text-sm text-gray-200 w-full whitespace-pre-wrap"></pre>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // Get the input and output elements from the DOM
        const fileInput = document.getElementById('json-file-input');
        const charCountDisplay = document.getElementById('char-count-display');
        const copyButton = document.getElementById('copy-button');
        const downloadButton = document.getElementById('download-button');
        const outputContainer = document.getElementById('output-container');
        const loader = document.getElementById('loader');
        const textOutput = document.getElementById('text-output');

        // Text generation variables
        let totalKeypresses = 0;
        let finalText = '';
        let visibleCharacters = [];

        // Add an event listener to the file input
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];

            // Reset state and UI
            totalKeypresses = 0;
            finalText = '';
            visibleCharacters = [];
            charCountDisplay.textContent = 'Count: 0';
            copyButton.disabled = true;
            downloadButton.disabled = true;
            textOutput.textContent = ''; // Clear previous text

            if (file) {
                if (file.type === 'application/json' || file.name.endsWith('.json')) {
                    const reader = new FileReader();

                    reader.onload = (e) => {
                        try {
                            const jsonData = JSON.parse(e.target.result);

                            if (Array.isArray(jsonData)) {
                                // Show output container and loader
                                outputContainer.classList.remove('hidden');
                                loader.classList.remove('hidden');

                                // Parse data and populate finalText
                                jsonData.forEach(item => {
                                    totalKeypresses++;
                                    const key = item.key;
                                    
                                    // Handle keys that produce visible characters
                                    if (key === 'Key.space') {
                                        visibleCharacters.push(' ');
                                    } else if (key === 'Key.enter') {
                                        visibleCharacters.push('\n');
                                    } else if (key.length === 1) {
                                        // This handles single character keys like 'a', 'b', '1', '!', etc.
                                        visibleCharacters.push(key);
                                    } else if (key.startsWith("'") && key.endsWith("'") && key.length === 3) {
                                        // Handles single characters that might be in single quotes, e.g. "'a'"
                                        visibleCharacters.push(key.slice(1, -1));
                                    }
                                    // All other keys (e.g., Key.shift, Key.ctrl) are ignored to prevent garbled output
                                });
                                finalText = visibleCharacters.join('');

                                // Wait for a brief moment to show the loader before displaying text
                                setTimeout(() => {
                                    // Update UI with the final result
                                    textOutput.textContent = finalText;
                                    charCountDisplay.textContent = `Count: ${visibleCharacters.length}`;
                                    loader.classList.add('hidden');
                                    copyButton.disabled = false;
                                    downloadButton.disabled = false;
                                }, 1000); // 1-second delay to show the loader

                                // Start the container entrance animation
                                setTimeout(() => {
                                    outputContainer.classList.remove('opacity-0', '-translate-y-2');
                                    outputContainer.classList.add('opacity-100', 'translate-y-0');
                                }, 10);

                            } else {
                                console.error('Error: The JSON file does not contain a valid array of keypress events.');
                            }
                        } catch (error) {
                            console.error('Error: Could not parse the file as a valid JSON.');
                        }
                    };
                    reader.readAsText(file);
                } else {
                    console.error('Error: Please select a valid JSON file.');
                }
            }
        });

        // Add event listener for the copy button
        copyButton.addEventListener('click', () => {
            if (finalText.trim() !== '') {
                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = finalText;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                document.execCommand('copy');
                document.body.removeChild(tempTextArea);
                
                copyButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                                      </svg>`;
                setTimeout(() => {
                    copyButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                          </svg>`;
                }, 2000);
            }
        });

        // Add event listener for the download button
        downloadButton.addEventListener('click', () => {
            if (finalText.trim() !== '') {
                const blob = new Blob([finalText], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = 'output.txt';
                document.body.appendChild(a);
                a.click();
                
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                downloadButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                                          </svg>`;
                setTimeout(() => {
                    downloadButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                              </svg>`;
                }, 2000);
            }
        });
    </script>
</body>
</html>
